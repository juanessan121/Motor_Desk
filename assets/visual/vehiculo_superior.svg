<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
<defs>
 <linearGradient id="body" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#EFF7FC"/><stop offset=".32" stop-color="#A9C0CF"/><stop offset=".52" stop-color="#687E8E"/><stop offset=".7" stop-color="#DCE8EF"/><stop offset="1" stop-color="#516A7B"/></linearGradient>
