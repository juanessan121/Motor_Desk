 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
<!-- no diagnostic hotspots are embedded in this neutral vehicle drawing -->
<ellipse cx="400" cy="640" rx="265" ry="500" fill="#000B16" opacity=".32" filter="url(#shadow)"/>
