services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - workshop_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workshop -d workshop']
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    env_file: ${MOTORDESK_DOCKER_ENV:?}
    environment:
      DATABASE_URL: postgresql+psycopg://workshop:${POSTGRES_PASSWORD}@db:5432/workshop
      WEB_DIRECTORY: /srv/web
    ports:
      - '127.0.0.1:${MOTORDESK_PORT:-8010}:8000'
    volumes:
      - ./build/web:/srv/web:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 40
      start_period: 60s
    restart: unless-stopped
volumes:
  workshop_data:
