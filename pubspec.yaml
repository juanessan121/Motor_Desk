name: app_web_1
description: Plataforma de mantenimiento vehicular con configuración remota.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  file_picker: ^13.1.0
  intl: ^0.20.2
  flutter_svg: ^2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/visual/
    - backend/app/resources/vehicle_templates.json
