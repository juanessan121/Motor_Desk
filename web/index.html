<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MotorDesk: gestión de clientes, vehículos y mantenimiento conectado.">
  <meta name="theme-color" content="#0E182A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MotorDesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>MotorDesk · Tu taller, conectado</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #F4F6FA; overscroll-behavior: none; }
    #loading { height: 100%; display: grid; place-content: center; text-align: center; font-family: system-ui, sans-serif; color: #0E182A; }
    #loading span { width: 30px; height: 30px; margin: 0 auto 20px; border: 3px solid #E1E8F5; border-top-color: #2563EB; border-radius: 50%; animation: spin .9s linear infinite; }
    #loading strong { font-size: 24px; letter-spacing: -.7px; }
    #loading p { font-size: 13px; color: #64748B; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading span { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status"><span></span><strong>MotorDesk</strong><p>Conectando tu taller…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () { document.getElementById('loading')?.remove(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
