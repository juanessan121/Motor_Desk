services:
  db:
    # pgvector sobre PostgreSQL 17: misma version mayor que postgres:17-alpine,
    # por lo que el volumen workshop_data es compatible sin conversion.
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute scripts/configure.ps1}
    ports:
      - "127.0.0.1:${MOTORDESK_DB_PORT:-5432}:5432"
    volumes:
      - workshop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://workshop:${POSTGRES_PASSWORD}@db:5432/workshop
      WEB_DIRECTORY: /srv/web
      # CACHE_DIR del importador, montado como volumen para no re-descargar
      # los datasets de ~60 MB en cada `docker compose run`.
      CATALOG_CACHE: /var/cache/motordesk/catalog
    ports:
      - "127.0.0.1:${MOTORDESK_PORT:-8000}:8000"
    volumes:
      - ./build/web:/srv/web:ro
      - catalog_cache:/var/cache/motordesk/catalog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  workshop_data:
  catalog_cache: